# Local PostgreSQL for development: `npm run db:up` (needs Docker Desktop running).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: memoir
      POSTGRES_PASSWORD: memoir
      POSTGRES_DB: memoir
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoir -d memoir"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
